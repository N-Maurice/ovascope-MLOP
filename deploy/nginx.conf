# Round-robin load balancing across all "api" containers.
# Docker's DNS (127.0.0.11) returns one address per replica; re-resolving every 5 s
# picks up containers added with `docker compose up --scale api=N`.
resolver 127.0.0.11 valid=5s ipv6=off;

server {
    listen 80;
    client_max_body_size 200m;
    location / {
        set $api_upstream http://api:8000;
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $request_id;
        proxy_read_timeout 300s;
    }
}
