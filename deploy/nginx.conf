# Load balancing across all "api" containers.
# least_conn sends each request to the container with the fewest requests in progress. Prediction time varies
# with the image, so plain round-robin left some containers idle while others had a queue.
# `resolve` (nginx >= 1.27.3) re-reads Docker's DNS (127.0.0.11) every 5 s, which picks up containers added
# with `docker compose up --scale api=N`.
resolver 127.0.0.11 valid=5s ipv6=off;

upstream api_pool {
    zone api_pool 64k;
    least_conn;
    server api:8000 resolve;
}

server {
    listen 80;
    client_max_body_size 200m;
    location / {
        proxy_pass http://api_pool;
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $request_id;
        proxy_read_timeout 300s;
    }
}
