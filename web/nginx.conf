# OvaScope web container: serves the built React app and forwards /api/* to the API gateway.
# Same origin for the browser, so no CORS configuration is needed.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    root /usr/share/nginx/html;
    client_max_body_size 200m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location /api/ {
        set $api http://gateway;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $api;
        proxy_set_header Host $host;
        proxy_read_timeout 300s;
    }

    location = /openapi.json {
        set $api http://gateway;
        proxy_pass $api;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Client-side routes (/classify, /admin, ...) all load index.html.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
